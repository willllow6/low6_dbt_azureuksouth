# Committed env.yml — resolves DBT_SCHEMA at run time.
# Update the CASE mapping as you add developers; each entry maps a
# Snowflake CURRENT_USER() value to the existing shortened schema name
# used for that person's local dev schema (dbt_wbreeden, etc).

env_config:
  default_environment: dev
  environments:
    - name: dev
      env:
        DBT_SCHEMA: "{{ select 'dbt_' || lower(case current_user() when 'WILLBREEDEN' then 'wbreeden' else current_user() end) }}"
    - name: prod
      env:
        DBT_SCHEMA: "analytics"

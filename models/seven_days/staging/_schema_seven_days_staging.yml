version: 2

models:

  - name: stg_seven_days__sessions
    description: >
      One row per session (deduplicated). A session is a single purchase of one or more
      instant-win tickets; the raw ticket JSON is parsed and flattened to entry grain in
      int_seven_days__sessions_flattened_to_entries.
    columns:
      - name: session_id
        tests:
          - unique
          - not_null

  - name: stg_seven_days__games
    description: >
      One row per game instance (a game configuration on one site, 1:1 with a raffle).
      contest_id is a surrogate key on site_id + game_id. is_prod is false for test games
      (no ticket_price).
    columns:
      - name: contest_id
        tests:
          - unique
          - not_null

  - name: stg_seven_days__instance_prize_arrays
    description: >
      One row per raffle prize list (latest load per site_id + raffle_id). payload:data:prizes
      holds the prize array with tier, name, type and odds ("1 in N") per prize.
    columns:
      - name: raffle_id
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [site_id, raffle_id]

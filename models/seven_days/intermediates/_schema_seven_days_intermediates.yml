version: 2

models:

  - name: int_seven_days__sessions_flattened_to_entries
    description: >
      One row per entry (individual ticket). Grain change from session (purchase) to entry,
      flattening the ticket_array JSON from stg_seven_days__sessions. The prize_* columns
      are the prize revealed on the ticket (null when nothing was won).
    columns:
      - name: entry_id
        tests:
          - unique
          - not_null

  - name: int_seven_days__prize_arrays_flattened_to_prizes
    description: >
      One row per prize per game instance. Grain change from the raffle prize list to prize,
      with odds parsed to a probability and a cash value parsed from the prize name where
      the name states one.
    columns:
      - name: prize_id
        tests:
          - unique
          - not_null

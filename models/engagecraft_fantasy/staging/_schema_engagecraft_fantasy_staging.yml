version: 2

models:

  - name: stg_engagecraft_fantasy__users
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['fantasy']
      - name: engagecraft_id
        tests:
          - not_null
      - name: ref_id
        tests:
          - not_null

  - name: stg_engagecraft_fantasy__tournaments

  - name: stg_engagecraft_fantasy__league_entries
    columns:
      - name: league_entry_id
        tests:
          - unique
          - not_null
      - name: league_id
        tests:
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: fantasy_team_id
        tests:

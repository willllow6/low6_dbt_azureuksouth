version: 2

sources:

  - name: engagecraft_fantasy
    description: EngageCraft Premier League fantasy football game database
    database: low6_azureuksouth
    schema: adfengagecraftfantasy
    tables:

      - name: user
      - name: tournament_calendar
      - name: contestants
      - name: persons
      - name: squad_membership
      - name: fantasy_player
      - name: fantasy_team
      - name: fantasy_team_player
      - name: fantasy_team_transfer
      - name: booster
      - name: league
      - name: league_entry
      - name: fantasy_player_gameweek
      - name: fantasy_team_gameweek_snapshot
      - name: gameweek
      - name: gameweek_booster
      - name: dreamteam_game_registration
        description: >
          One-off historical load of the previous supplier's (NUK Dream Team) 2025-26 game
          registrations (NUK_DREAMTEAM_GAMEREGISTRATION_20260601010504.csv), loaded by
          scripts/load_engagecraft_dreamteam_game_registrations.py. Not refreshed by ADF.

version: 2

models:

  - name: dim_engagecraft_fantasy__users
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['fantasy']
      - name: engagecraft_id
        tests:
          - not_null
      - name: ref_id
        tests:
          - not_null

  - name: dim_engagecraft_fantasy__tournaments
    columns:
      - name: tournament_id
        tests:
          - unique
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['fantasy']
      - name: tournament_status
        tests:
          - not_null

  - name: dim_engagecraft_fantasy__gameweeks
    columns:
      - name: gameweek_id
        tests:
          - unique
          - not_null
      - name: tournament_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_engagecraft_fantasy__tournaments')
              field: tournament_id
      - name: client_id
        tests:
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['fantasy']
      - name: gameweek_status
        tests:
          - not_null
      - name: gameweek_number
        tests:
          - not_null


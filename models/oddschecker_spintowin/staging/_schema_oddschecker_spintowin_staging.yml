version: 2

models:

  - name: stg_oddschecker_spintowin__users
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: external_user_id
        tests:
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['instant_win']

  - name: stg_oddschecker_spintowin__activities
    columns:
      - name: activity_id
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['instant_win']
      - name: prize_type
        tests:
          - accepted_values:
              values: ['voucher', 'oc_plus']
              where: "is_winner = true"

  - name: stg_oddschecker_spintowin__prize_tiers
    columns:
      - name: prize_tier_id
        tests:
          - unique
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['instant_win']
      - name: prize_tier_name
        tests:
          - not_null

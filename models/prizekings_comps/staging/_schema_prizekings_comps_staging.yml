        tests:
          - not_null
      - name: affiliate_id
        tests:
          - not_null

  - name: stg_prizekings_comps__deposit_attribution
    columns:
      - name: attribution_id
        tests:
          - unique
          - not_null
      - name: transaction_id
        tests:
          - not_null
      - name: user_id
        tests:
          - not_null

  - name: stg_prizekings_comps__user_registration_attribution
    columns:
      - name: attribution_id
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: affiliate_id
        tests:
          - not_null

  - name: stg_prizekings_comps__prizes
    columns:
      - name: prize_sk
        tests:
          - unique
          - not_null
      - name: contest_id
        tests:
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['prize_competition']
      - name: prize_type
        tests:
          - not_null
          - accepted_values:
              values: ['main', 'second', 'instant']

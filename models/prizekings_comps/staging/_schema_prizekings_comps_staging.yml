version: 2

models:

  - name: stg_prizekings_comps__competition
    columns:
      - name: contest_sk
        tests:
          - unique
          - not_null
      - name: contest_id
        tests:
          - unique
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['prize_competition']
      - name: contest_type
        tests:
          - not_null
          - accepted_values:
              values: ['spot_the_ball']
      - name: contest_status
        tests:
          - not_null

  - name: stg_prizekings_comps__raffles
    columns:
      - name: contest_sk
        tests:
          - unique
          - not_null
      - name: contest_id
        tests:
          - unique
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['prize_competition']
      - name: contest_type
        tests:
          - not_null
          - accepted_values:
              values: ['draw']

  - name: stg_prizekings_comps__competition_entry
    columns:
      - name: entry_sk
        tests:
          - unique
          - not_null
      - name: entry_id
        tests:
          - unique
          - not_null
      - name: contest_id
        tests:
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['prize_competition']

  - name: stg_prizekings_comps__user_raffle_tickets
    columns:
      - name: entry_sk
        tests:
          - unique
          - not_null
      - name: entry_id
        tests:
          - unique
          - not_null
      - name: contest_id
        tests:
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['prize_competition']

  - name: stg_prizekings_comps__transactions
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['prize_competition']
      - name: transaction_direction
        tests:
          - not_null
          - accepted_values:
              values: ['incoming', 'outgoing']
      - name: balance_type
        tests:
          - accepted_values:
              values: ['deposit', 'site_credit']

  - name: stg_prizekings_comps__users
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['prize_competition']

  - name: stg_prizekings_comps__tenants
    columns:
      - name: tenant_id
        tests:
          - unique
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['prize_competition']

  - name: stg_prizekings_comps__promotions
    columns:
      - name: promotion_id
        tests:
          - unique
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['prize_competition']

  - name: stg_prizekings_comps__competition_prize
    columns:
      - name: prize_sk
        tests:
          - unique
          - not_null
      - name: contest_id
        tests:
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              values: ['prize_competition']
      - name: prize_type
        tests:
          - not_null
          - accepted_values:
              values: ['main', 'second', 'instant']

  - name: stg_prizekings_comps__affiliates
    columns:
      - name: affiliate_id
        tests:
          - unique
          - not_null
      - name: affiliate_name
        tests:
          - not_null
      - name: affiliate_code
        tests:
          - unique
          - not_null

  - name: stg_prizekings_comps__campaigns
    columns:
      - name: campaign_id
        tests:

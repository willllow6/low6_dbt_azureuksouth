version: 2

models:

  - name: int_gaming1__selection_entries
    description: >
      One row per user per pickem contest. Grain change from stg_gaming1__selections
      (selection grain); entry_id is a surrogate key on (user_id, contest_id).
    columns:
      - name: entry_id
        tests:
          - unique
          - not_null

  - name: int_gaming1__contests_unioned
    description: >
      One row per contest: pickem contests unioned with squads rounds, with the contest's
      tenant resolved. Squads starts_at is the first day's reveal start; ends_at is the match
      window end, else the last day's reveal end.
    columns:
      - name: contest_id
        tests:
          - unique
          - not_null

  - name: int_gaming1__entries_unioned
    description: >
      One row per user per contest: pickem entries (from int_gaming1__selection_entries)
      unioned with squads entries. user_entry_number is scoped per game_type.
    columns:
      - name: entry_id
        tests:
          - unique
          - not_null

  - name: int_gaming1__selections_unioned
    description: >
      One row per selection: pickem selections unioned with squads picked slots
      (selection_id = slot id).
    columns:
      - name: selection_id
        tests:
          - unique
          - not_null

  - name: int_gaming1__user_tenants
    description: >
      One row per user with their tenant: the platform's only tenant while there is one (so
      every user, entered or not, has it); otherwise location -> tenant_code match, else the
      tenant of the user's first entry in either game, else client_id. Users carry no tenant
      and location is null in production.
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
